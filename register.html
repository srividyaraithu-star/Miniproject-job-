<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-image: url('https://images.unsplash.com/photo-1492724441997-5dc865305da7'); background-size: cover; background-position: center; min-height: 100vh;">

<main class="container d-flex justify-content-center align-items-center py-5" style="min-height: 100vh;">
    <section class="card p-4 shadow" style="background: rgba(255,255,255,0.94); border-radius: 12px; width: min(100%, 380px);">
        <div class="text-end mb-3">
            <button type="button" onclick="setLanguage('en')" class="btn btn-sm btn-outline-primary" data-lang-button="en" data-i18n="english">English</button>
            <button type="button" onclick="setLanguage('te')" class="btn btn-sm btn-outline-success" data-lang-button="te" data-i18n="telugu">Telugu</button>
            <button type="button" onclick="setLanguage('hi')" class="btn btn-sm btn-outline-danger" data-lang-button="hi" data-i18n="hindi">Hindi</button>
        </div>

        <h1 class="h3 text-center text-success mb-4" data-i18n="register">Register</h1>

        {% if error %}
            <div class="alert alert-danger py-2">{{ error }}</div>
        {% endif %}

        <form action="/register" method="POST">
            <div class="input-group mb-3">
                <input type="text" name="username" id="username" class="form-control" placeholder="Username" data-i18n-placeholder="usernamePlaceholder" required>
                <button type="button" onclick="startVoice('username')" class="btn btn-outline-secondary" data-i18n="mic">Mic</button>
            </div>

            <div class="input-group mb-3">
                <input type="password" name="password" id="password" class="form-control" placeholder="Password" data-i18n-placeholder="passwordPlaceholder" required>
                <button type="button" onclick="startVoice('password')" class="btn btn-outline-secondary" data-i18n="mic">Mic</button>
            </div>

            <div class="input-group mb-3">
                <input type="text" name="location" id="location" class="form-control" placeholder="Location" data-i18n-placeholder="locationAddPlaceholder" required>
                <button type="button" onclick="startVoice('location')" class="btn btn-outline-secondary" data-i18n="mic">Mic</button>
            </div>

            <div class="input-group mb-3">
                <input type="text" name="education" id="education" class="form-control" placeholder="Education" data-i18n-placeholder="educationPlaceholder" required>
                <button type="button" onclick="startVoice('education')" class="btn btn-outline-secondary" data-i18n="mic">Mic</button>
            </div>

            <div class="input-group mb-3">
                <input type="text" name="skills" id="skills" class="form-control" placeholder="Skills, for example agriculture" data-i18n-placeholder="registerSkillsPlaceholder" required>
                <button type="button" onclick="startVoice('skills')" class="btn btn-outline-secondary" data-i18n="mic">Mic</button>
            </div>

            <button type="submit" class="btn btn-success w-100" data-i18n="register">Register</button>
            <button type="button" onclick="startVoice()" class="btn btn-dark w-100 mt-2" data-i18n="speak">Speak</button>
            <p id="voice_status" class="small text-center text-muted mt-2 mb-0" data-i18n="voiceHelp">Click Speak and say your command.</p>
        </form>

        <div class="text-center mt-3">
            <p class="mb-2" data-i18n="alreadyAccount">Already have an account?</p>
            <a href="/login" class="btn btn-outline-dark w-100" data-i18n="login">Login</a>
        </div>
    </section>
</main>

<script src="{{ url_for('static', filename='i18n.js', v=16) }}"></script>
<script src="{{ url_for('static', filename='voice.js', v=8) }}"></script>

</body>
</html>
