<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Job Finder</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body style="background-image: url('https://images.unsplash.com/photo-1521791136064-7986c2920216'); background-size: cover; background-position: center; min-height: 100vh;">

<nav class="navbar navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand text-warning fw-bold" href="/" data-i18n="appName">AI Job Finder</a>
    <div class="d-flex gap-2">
      <button type="button" onclick="setLanguage('en')" class="btn btn-outline-light" data-lang-button="en" data-i18n="english">English</button>
      <button type="button" onclick="setLanguage('te')" class="btn btn-outline-light" data-lang-button="te" data-i18n="telugu">Telugu</button>
      <button type="button" onclick="setLanguage('hi')" class="btn btn-outline-light" data-lang-button="hi" data-i18n="hindi">Hindi</button>
      <a href="/welcome" class="btn btn-outline-light" data-i18n="home">Home</a>
      <a href="/dashboard" class="btn btn-outline-light" data-i18n="dashboard">Dashboard</a>
      <a href="/required_skills" class="btn btn-outline-light" data-i18n="requiredSkillsPage">Required Skills</a>
      <a href="/all_jobs" class="btn btn-outline-light" data-i18n="allJobs">All Jobs</a>
      <a href="/add_job" class="btn btn-success" data-i18n="addJob">Add Job</a>
      <a href="/logout" class="btn btn-danger" data-i18n="logout">Logout</a>
    </div>
  </div>
</nav>

<main class="container d-flex justify-content-center align-items-center py-5" style="min-height: 90vh;">
    <section class="card shadow p-4" style="background: rgba(255,255,255,0.94); border-radius: 12px; width: min(100%, 430px);">
        <h1 class="h3 text-center mb-4 fw-bold" data-i18n="findMatchingJobs">Find Matching Jobs</h1>

        <form id="jobForm" action="/result" method="post">
            <div class="mb-3">
                <label for="skill_input" class="form-label" data-i18n="skills">Skills</label>
                <input id="skill_input" type="text" name="skills" class="form-control" placeholder="Example: Python, farming, driving" data-i18n-placeholder="skillsPlaceholder" required>
            </div>

            <div class="mb-3">
                <label for="location_input" class="form-label" data-i18n="location">Location</label>
                <input id="location_input" type="text" name="location" class="form-control" placeholder="Example: Hyderabad" data-i18n-placeholder="locationPlaceholder" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 mt-2" data-i18n="findJobs">Find Jobs</button>
            <a href="/required_skills" class="btn btn-outline-success w-100 mt-3" data-i18n="knowRequiredSkills">Know Required Skills</a>
            <button type="button" onclick="startVoice()" class="btn btn-dark w-100 mt-3" data-i18n="speak">Speak</button>
            <p id="voice_status" class="small text-center text-muted mt-3 mb-0" data-i18n="voiceHelp">
                Click Speak and say your skill and location.
            </p>
        </form>

    </section>
</main>

<script src="{{ url_for('static', filename='i18n.js', v=16) }}"></script>
<script src="{{ url_for('static', filename='voice.js', v=8) }}"></script>

</body>
</html>
